<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>

  <script src="script.js" defer></script>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<body>

  <main class="main_container">

    <!-- Header/Input - Section -->
    <header class="input_container">
      <input type="text" name="city_input" id="city_input" class="city_input" placeholder="Search City">
      <button class="search_btn">
        <span class="material-symbols-outlined">search</span>
      </button>
    </header>

    <!-- Weather - info - Section -->
    <section class="wearther_info" style="display: none;">
      <div class="location_date_container">
        <div class="location">
          <span class="material-symbols-outlined">location_on</span>
          <h4 class="country_txt">
            Jakarta
          </h4>
        </div>
        <h5 class="current_date_txt txt_regular">Web, 16 Aug</h5>
      </div>

      <!-- Weather - summary - container -->
      <div class="weather_summary_container">
        <img src="./assets/weather/clouds.svg" alt="clouds_img" class="weather_summary_img">
        <div class="weather_summary_info">
          <h1 class="temp_text">29 °C</h1>
          <h3 class="condition_txt txt_regular">Clouds</h3>
        </div>
      </div>

      <!-- Weather - Conditions - container -->
      <div class="weather_conditions_container">
        <div class="condition_items">
          <span class="material-symbols-outlined">water_drop</span>
          <div class="condition_info">
            <h5 class="txt_regular">Humidity</h5>
            <h5 class="humidity_value_txt">55%</h5>
          </div>
        </div>

        <div class="condition_items">
          <span class="material-symbols-outlined">air</span>
          <div class="condition_info">
            <h5 class="txt_regular">Wind Speed</h5>
            <h5 class="wind_value_txt">2 M/s</h5>
          </div>
        </div>
      </div>

      <!-- Weather - Forecaste - container -->

    </section>

    <!-- MESSAGE -->
    <!-- MESSAGE - Search -->
    <section class="search_city section_message">
      <img src="./assets/message/search-city.png" alt="section_message_img">
      <div>
        <h1>Search City</h1>
        <h4 class="txt_regular">Find out the weather conditions of the city</h4>
      </div>
    </section>

    <!-- MESSAGE - Not found -->
    <section class="not_found section_message" style="display: none;">
      <img src="./assets/message/not-found.png" alt="section_message_img">

        <h1>Search City</h1>
