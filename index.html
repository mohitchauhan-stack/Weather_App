<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="icon" type="image/png" href="./assets/message/search-city.png" />
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <main class="main_container">
      <!-- Header/Input - Section -->
      <header class="input_container">
        <input
          type="text"
          name="city_input"
          id="city_input"
          class="city_input"
          placeholder="Search City"
        />
        <button class="search_btn">
          <img
            src="./assets/search_btn.png"
            alt="search_bnt_img"
            class="search_bnt_img"
          />
        </button>
      </header>
      <!-- Weather - info - Section -->
      <section class="weather_info" style="display: none">
        <div class="location_date_container">
          <div class="location">
            <span class="material-symbols-outlined"></span>
            <h4 class="country_txt"></h4>
          </div>
          <h5 class="current_date_txt txt_regular"></h5>
        </div>
        <!-- Weather - summary - container -->
        <div class="weather_summary_container">
          <img src="" alt="clouds_img" class="weather_summary_img" />
          <div class="weather_summary_info">
            <h1 class="temp_text"></h1>
            <h3 class="condition_txt txt_regular"></h3>
          </div>
        </div>
        <!-- Weather - Conditions - container -->
        <div class="weather_conditions_container">
          <div class="condition_items">
            <span class="material-symbols-outlined">water_drop</span>
            <div class="condition_info">
              <h5 class="txt_regular">Humidity</h5>
              <h5 class="humidity_value_txt"></h5>
            </div>
          </div>
          <div class="condition_items">
            <span class="material-symbols-outlined">air</span>
            <div class="condition_info">
              <h5 class="txt_regular">Wind Speed</h5>
              <h5 class="wind_value_txt"></h5>
            </div>
          </div>
        </div>
        <!-- Weather - Forecast - container -->
        <div class="forecast_items_container"></div>
      </section>
      <!-- MESSAGE - Search -->
      <section class="search_city section_message">
        <img src="./assets/message/search-city.png" alt="section_message_img" />
        <div>
          <h1>Search City</h1>
          <h4 class="txt_regular">
            Find out the weather conditions of the city
          </h4>
        </div>
      </section>
      <!-- MESSAGE - Not found -->
      <section class="not_found section_message" style="display: none">
        <img src="./assets/message/not-found.png" alt="section_message_img" />
        <div>
          <h1>City not found !</h1>
        </div>
      </section>

      <!-- MESSAGE - Loading... -->
      <section class="loading section_message" style="display: none">
        <h1>Loading...</h1>
      </section>

      <!-- MESSAGE - Forecast loading... -->
      <section class="forecast_loading" style="display: none">
        <h5>Loading forecast...</h5>
      </section>

      <!-- MESSAGE - Network Error  -->
      <section class="network_error section_message" style="display: none">
        <img src="./assets/message/no_internet.png" alt="section_message_img" />
        <div>
          <h1>Something went wrong</h1>
          <h4 class="txt_regular">
            Please check your internet connection and try again.
          </h4>
        </div>
      </section>

      <!-- MESSAGE - Forecast Error  -->
      <section class="forecast_error section_message" style="display: none">
        <img src="./assets/message/error.png" alt="section_message_img" />
        <div>
          <h1>Forecaste unavailable !</h1>
        </div>
      </section>
    </main>
  </body>
</html>
